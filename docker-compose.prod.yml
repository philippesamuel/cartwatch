services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: prefect
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prefect_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web_proxy

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    # image is always pulled from GHCR via deploy.yml — build section unused in prod
    build:
      target: prod
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      prefect-server:
        condition: service_healthy
    labels:
      caddy_0: cartwatch.philippecosta.de
      caddy_0.handle_path: /api/*
      caddy_0.handle_path.reverse_proxy: "{{upstreams 8000}}"
      caddy_0.handle_path.reverse_proxy.flush_interval: "-1"
    networks:
      - web_proxy

  prefect-server:
    image: prefecthq/prefect:3.7.3-python3.12
    command: prefect server start
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: https://prefect.philippecosta.de/api
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:${POSTGRES_PASSWORD:-prefect_password}@postgres:5432/prefect
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    labels:
      caddy_0: prefect.philippecosta.de
      caddy_0.basic_auth: ""
      caddy_0.basic_auth.philippe: "${CADDY_BASIC_AUTH_HASH_PREFECT}"
      caddy_0.reverse_proxy: "{{upstreams 4200}}"
      caddy_0.reverse_proxy.flush_interval: "-1"
    networks:
      - web_proxy

  prefect-worker:
    image: ghcr.io/${GITHUB_REPOSITORY}/worker:latest
    build:
      context: ./backend
      target: worker
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    env_file:
      - .env.prod
    restart: unless-stopped
    depends_on:
      prefect-server:
        condition: service_healthy
    networks:
      - web_proxy

volumes:
  postgres_data:

networks:
  web_proxy:
    external: true
