services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/backend:latest
    build:
      target: prod
    restart: unless-stopped
    env_file:
      - .env.prod
    labels:
      caddy_0: api.cartwatch.philippecosta.de
      caddy_0.reverse_proxy: "{{upstreams 8000}}"
    networks:
      - web_proxy

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY}/frontend:latest
    build:
      target: prod
    restart: unless-stopped
    env_file:
      - .env.prod
    labels:
      caddy_0: cartwatch.philippecosta.de
      caddy_0.reverse_proxy: "{{upstreams 3000}}"
    networks:
      - web_proxy

networks:
  web_proxy:
    external: true
