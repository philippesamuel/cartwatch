name: Deploy

on:
  workflow_dispatch:
    
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.api
          target: prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.worker
          target: worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:latest
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --extra worker --no-dev

      - name: Deploy Prefect flows
        working-directory: backend
        env:
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
        run: PYTHONPATH=app uv run prefect deploy --all

      - name: Copy docker-compose file to server
        uses: appleboy/scp-action@v1
        with:
          port: ${{ secrets.HETZNER_SSH_PORT }}
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/deploy/cartwatch/"

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          port: ${{ secrets.HETZNER_SSH_PORT }}
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GITHUB_REPOSITORY
          script: |
            cd /home/deploy/cartwatch
            echo "${{ secrets.GHCR_TOKEN }}" | docker login -u ${{ github.actor }} --password-stdin ghcr.io
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
