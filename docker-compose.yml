services:
  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    depends_on:
      - prefect-server

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_UI_API_URL: http://localhost:4200/api
    volumes:
      - prefect_data:/root/.prefect
    ports:
      - "4200:4200"

  prefect-worker:
    build:
      context: ./backend
      target: worker
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    env_file:
      - .env
    depends_on:
      - prefect-server

volumes:
  prefect_data: