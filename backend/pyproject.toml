[project]
name = "cartwatch_backend"
version = "0.1.0"
description = "Backend for grocery price tracker"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "crawlee[cli]>=1.7.2",
    "fastapi[standard]>=0.133.1",
    "google-api-python-client>=2.190.0",
    "google-auth>=2.48.0",
    "google-auth-oauthlib>=1.3.0",
    "loguru>=0.7.3",
    "pdfplumber>=0.11.9",
    "playwright>=1.60.0",
    "prefect>=3.6.20",
    "pydantic-ai>=1.63.0",
    "pydantic-settings>=2.13.1",
    "requests>=2.32.5",
    "supabase>=2.28.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipython>=9.14.1",
    "marimo>=0.23.8",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-env>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
env = [
    "SUPABASE_URL=''",
    "SUPABASE_ANON_KEY=''",
    "SUPABASE_SERVICE_KEY=''",
    "MISTRAL_API_KEY=''",
    "SUPABASE_USER_ID=''", 
    "GMAIL_CLIENT_ID=''", 
    "GMAIL_CLIENT_SECRET=''", 
    "GMAIL_REFRESH_TOKEN=''", 
]
filterwarnings = [
    "ignore::DeprecationWarning:supabase",
]
markers = ["integration: requires external services",]
addopts = "-m 'not integration'"

[tool.ruff]
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort

[tool.ruff.lint.isort]
known-first-party = ["app"]
