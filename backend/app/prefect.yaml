deployments:
  - name: ingest-receipts
    flow: flows.ingest:ingest_receipts
    work_pool:
      name: local-pool
    schedules:
      - cron: "0 5 * * *"   # daily 8am

  - name: extract-receipts
    flow: flows.extract:extract_receipts
    work_pool:
      name: local-pool
    schedules:
      - cron: "0 6 * * 1"   # every Monday 6am
