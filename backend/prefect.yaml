---
name: backend
prefect-version: 3.6.20

build: null
push: null

pull:
- prefect.deployments.steps.set_working_directory:
    directory: /backend

deployments:

# ── REWE ──────────────────────────────────────────────────────────────────────

- name: scrape-rewe-offers
  entrypoint: app/flows/scrape_rewe_offers.py:scrape_offers_flow
  parameters: {}
  work_pool:
    name: ecs-pool
    job_variables:
      env:
        SUPABASE_URL: "{{ $SUPABASE_URL }}"
        SUPABASE_USER_ID: "{{ $SUPABASE_USER_ID }}"
        PREFECT_LOGGING_EXTRA_LOGGERS: ingestion
  schedules:
  - cron: 0 4 * * *
    timezone: UTC
    day_or: true
    active: true

# ── NETTO ─────────────────────────────────────────────────────────────────────

# Coordinator: runs on Hetzner, fans out batches to ECS via run_deployment()
- name: scrape-netto-offers
  entrypoint: app/flows/scrape_netto_offers.py:scrape_offers_flow
  parameters:
    batch_size: 16
  work_pool:
    name: local-pool
  schedules:
  - cron: 0 3 * * *
    timezone: UTC
    day_or: true
    active: true

# ECS worker: one deployment run per batch, triggered by the coordinator.
# Name "scrape-netto-store-batch_ecs" matches run_deployment(name="scrape-netto-store-batch/scrape-netto-store-batch_ecs")
- name: scrape-netto-store-batch_ecs
  entrypoint: app/flows/scrape_netto_offers.py:scrape_store_flow
  parameters: {}
  work_pool:
    name: ecs-pool
    job_variables:
      env:
        SUPABASE_URL: "{{ $SUPABASE_URL }}"
        SUPABASE_USER_ID: "{{ $SUPABASE_USER_ID }}"
        PREFECT_LOGGING_EXTRA_LOGGERS: ingestion
  schedules: []
